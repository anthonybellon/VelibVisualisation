[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "velib-visualisation"
version = "2.0.0"
description = "Forecast and map Vélib' bike availability across Paris, one week ahead."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pre-commit>=3.5",
]

[project.scripts]
velib = "velib.cli:main"

[tool.setuptools.packages.find]
include = ["velib*"]

# ------------------------------------------------------------------------------
# Ruff (lint + format)
# ------------------------------------------------------------------------------

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["archive", "notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security)
]
ignore = ["E501"] # line length is handled by the formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # assert is how pytest works

[tool.ruff.lint.isort]
known-first-party = ["velib"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

# ------------------------------------------------------------------------------
# Tests
# ------------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["velib"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
