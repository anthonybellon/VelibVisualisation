# Ruff configuration
# https://docs.astral.sh/ruff/configuration/

[tool.ruff]
# Target Python 3.9+
target-version = "py39"

# Set line length to 100
line-length = 100

[tool.ruff.lint]
# Enable common lint rules
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
]

# Ignore specific rules
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function-call-in-default-argument
    "C901",   # too complex
    "ARG001", # unused function argument
]

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    ".eggs",
    "build",
    "dist",
    "node_modules",
]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with 4 spaces
indent-style = "space"

# Use Unix line endings
line-ending = "lf"

[tool.ruff.lint.isort]
# Group imports
known-first-party = ["config", "feature_engineering", "logging_config", "utils"]

[tool.ruff.lint.per-file-ignores]
# Tests can use assert and have unused imports
"tests/*" = ["S101", "F401"]
# Notebooks can have unused imports
"notebooks/*" = ["F401"]

# Black configuration
[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | \.eggs
  | build
  | dist
)/
'''

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# Mypy configuration (optional type checking)
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "notebooks/",
]

# Coverage configuration
[tool.coverage.run]
source = ["scripts"]
omit = [
    "scripts/other_scripts/*",
    "scripts/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
